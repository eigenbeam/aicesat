<!DOCTYPE html>
<html lang="en">
<head>

<title>Cross-mission altimetry</title>
<style>{{CSS}}</style>
</head>
<body>
<div id="topbar">
  <span class="brand">Cross-mission altimetry</span>
  <span class="tagline">compare ICESat-1, IceBridge &amp; ICESat-2 elevations</span>
  <button id="topBack" class="tab backbtn" hidden title="Back to where you came from">← Back</button>
  <button class="tab" data-view="explore" title="Pick an area on the globe, then build a scene from the missions there">Explore</button>
  <button class="tab" data-view="lake" title="Local data cache — developer view">Data Lake</button>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <button id="fullscreenBtn" class="tab" hidden title="fullscreen">⛶</button>
  <span class="small" id="adapterInfo"></span>
</div>
<div id="apperr" hidden></div>
<div id="views">
  <div class="view" id="view-explore"></div>
  <div class="view" id="view-lake"></div>
  <div class="view" id="view-scene"></div>
</div>
<script>{{VENDOR_H3}}</script>
<script>{{VENDOR_LAND}}</script>

<script>{{VENDOR_BRIDGE}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
