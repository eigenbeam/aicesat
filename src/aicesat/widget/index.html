<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross-mission altimetry — co-registration reveal</title>
<script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
<style>
  :root { --bg:#14141a; --panel:rgba(20,20,26,.86); --ink:#ece9e0; --muted:#a6a39a; --hair:#3a3a44;
          --blue:#378ADD; --coral:#D85A30; --amber:#E0A030; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #deck { position:absolute; inset:0; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--hair); border-radius:10px;
    padding:12px 14px; backdrop-filter: blur(6px); }
  #hud { top:12px; left:12px; max-width:420px; }
  #hud h1 { font-size:15px; margin:0 0 4px; font-weight:600; }
  #hud .q { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }
  #controls { bottom:12px; left:12px; display:flex; gap:10px; align-items:center; }
  button { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--hair);
    background:#22222a; color:var(--ink); cursor:pointer; }
  button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #stats { top:112px; right:12px; width:372px; max-height:calc(100% - 124px); overflow-y:auto; }
  #stats h2 { font-size:13px; margin:0 0 6px; font-weight:600; }
  canvas.hist { width:100%; height:110px; display:block; background:#1b1b22; border-radius:6px; }
  .readout { font-size:13px; margin:8px 0 4px; }
  .readout b { color:var(--amber); }
  #exag { position:absolute; top:12px; right:12px; width:372px; background:rgba(224,160,48,.15); border:1px solid var(--amber);
    color:var(--amber); font-size:12px; padding:8px 12px; border-radius:8px; max-width:360px; }
  #unresolved { font-size:12px; color:var(--muted); margin-top:6px; border-top:1px solid var(--hair); padding-top:6px; }
  #status { color:var(--muted); font-size:12px; }
  .small { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div id="deck"></div>
<div id="hud" class="panel">
  <h1 id="title">Cross-mission altimetry</h1>
  <div class="q" id="question"></div>
  <div class="legend" id="legend"></div>
  <div class="small" id="framenote"></div>
</div>
<div id="exag" hidden></div>
<div id="controls" class="panel">
  <span>Co-registration:</span>
  <button id="btnOff" class="on">OFF (native)</button>
  <button id="btnOn">ON (ITRF2014 @ common epoch)</button>
  <span id="status"></span>
  <span style="margin-left:14px">Vertical ×<b id="zexagVal">10</b></span>
  <input id="zexag" type="range" min="1" max="50" step="1" value="10" style="width:120px">
  <label style="font-size:12px;color:var(--muted)"><input id="imagery" type="checkbox" checked> imagery</label>
</div>
<div id="attrib" style="position:absolute; bottom:4px; right:396px; font-size:10px; color:var(--muted)"></div>
<div id="stats" class="panel" hidden>
  <h2>Co-located Δh (ICESat-2 − GLAS)</h2>
  <canvas class="hist" id="histDh"></canvas>
  <div class="readout" id="readout1"></div>
  <h2 style="margin-top:8px">Per-pair plate-motion artifact (horizontal re-pairing only, native heights)</h2>
  <canvas class="hist" id="histArt"></canvas>
  <div class="readout" id="readout2"></div>
  <div id="unresolved"></div>
</div>
<script src="app.js"></script>
</body>
</html>
