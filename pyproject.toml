[project]
name = "aicesat"
version = "0.1.0"
description = "Cross-mission altimetry demo: ICESat-2 + GLAS co-registration reveal (MCP server + deck.gl widget)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2",
    "earthaccess>=0.18",
    "h5py>=3.12",
    "numpy>=2",
    "scipy>=1.14",
    "pyproj>=3.7",
    "h3>=4.5.0",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "pillow>=12.3.0",
    "sliderule>=5.5.0",
    "harmony-py>=1.6.0",
    "h3ronpy>=0.22.0",
    "rasterio>=1.5.1",
]

[project.scripts]
aicesat-server = "aicesat.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicesat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
